# Keep the examples install independent from the SDK workspace. This makes the
# checked-in examples lockfile authoritative when examples:setup swaps in a
# freshly packed SDK tarball.
allowBuilds:
  cbor-extract: true
  esbuild: true
  libsodium-sumo: true
  libsodium-wrappers: true
  libsodium-wrappers-sumo: true
overrides:
  libsodium-wrappers-sumo: 0.8.2
  libsodium-sumo: 0.8.2
  "tsup>esbuild": "^0.28.1"
  # Security patches reaching in through @lucid-evolution (same as sdk/).
  ip-address: ">=10.7.1"
  pbkdf2: ">=3.1.7 <4"
